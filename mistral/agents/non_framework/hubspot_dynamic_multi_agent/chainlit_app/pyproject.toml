[project]
name = "hubspot-dynamic-multi-agent"
version = "0.1.0"
description = "HubSpot dynamic multi-agent system"
authors = [{name = "Ravi Theja", email = "ravi03071991@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.12.0",
    "mistralai>=1.9.3",
    "hubspot-api-client>=12.0.0",
]

[tool.uv]
constraint-dependencies = ["mcp>=1.28.1,<2", "aiohttp>=3.14.3", "urllib3>=2.7.0", "pyjwt>=2.13.0", "python-multipart>=0.0.31", "starlette>=0.49.1", "protobuf>=5.29.6", "python-socketio>=5.16.2", "python-engineio>=4.13.2", "requests>=2.33.0", "idna>=3.15", "filelock>=3.20.3", "marshmallow>=3.26.2"]
